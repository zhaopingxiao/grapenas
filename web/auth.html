<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>葡萄云 GrapeNAS · 访问验证</title>
<link rel="icon" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1030 0%, #2d1b4e 50%, #1a1030 100%);
    color: #e5e0f5;
  }
  .card {
    width: 420px;
    padding: 40px 36px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(167, 139, 250, 0.25);
    backdrop-filter: blur(12px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  .card.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .logo { display: flex; justify-content: center; margin-bottom: 12px; }
  h1 { font-size: 26px; letter-spacing: 4px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #a89ecf; margin-bottom: 26px; }
  .group-label { font-size: 13px; color: #a89ecf; margin-bottom: 10px; }
  .code-boxes {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .code-boxes input {
    width: 38px;
    height: 50px;
    text-align: center;
    font-size: 22px;
    border-radius: 10px;
    border: 1px solid rgba(167, 139, 250, 0.35);
    background: rgba(0, 0, 0, 0.3);
    color: #fff;
    outline: none;
    caret-color: #8b5cf6;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .code-boxes input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { min-height: 20px; margin-top: 14px; font-size: 13px; color: #f87171; }
  .hidden { display: none !important; }

  /* 手机端：访问码两行，每行 4 格 */
  @media (max-width: 480px) {
    .card { width: 92vw; padding: 32px 22px; }
    .code-boxes { display: grid; grid-template-columns: repeat(4, 52px); gap: 10px; }
    .code-boxes input { width: 52px; height: 60px; font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">
      <svg viewBox="0 0 48 44" width="56" height="52" aria-hidden="true">
        <rect x="22.5" y="0" width="3" height="9" rx="1.5" fill="#7c5a3a"/>
        <ellipse cx="31" cy="5" rx="6" ry="3.2" fill="#4ade80" transform="rotate(-24 31 5)"/>
        <circle cx="17" cy="15" r="6" fill="#a78bfa"/>
        <circle cx="31" cy="15" r="6" fill="#8b5cf6"/>
        <circle cx="11" cy="25" r="6" fill="#8b5cf6"/>
        <circle cx="24" cy="25" r="6" fill="#7c3aed"/>
        <circle cx="37" cy="25" r="6" fill="#8b5cf6"/>
        <circle cx="17" cy="35" r="6" fill="#7c3aed"/>
        <circle cx="31" cy="35" r="6" fill="#6d28d9"/>
      </svg>
    </div>
    <h1>葡萄云</h1>
    <p class="sub" id="subtitle">请输入 8 位访问码</p>
    <form id="form">
      <p class="group-label hidden" id="label1">设置访问码</p>
      <div class="code-boxes" id="group1"></div>
      <p class="group-label hidden" id="label2">确认访问码</p>
      <div class="code-boxes hidden" id="group2"></div>
      <button id="btn" type="submit">进 入</button>
    </form>
    <p class="error" id="error"></p>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || '/';
  let needSetup = false;

  const cardEl = document.getElementById('card');
  const subtitleEl = document.getElementById('subtitle');
  const label1El = document.getElementById('label1');
  const label2El = document.getElementById('label2');
  const group1El = document.getElementById('group1');
  const group2El = document.getElementById('group2');
  const btnEl = document.getElementById('btn');
  const errorEl = document.getElementById('error');

  // ---------- 分格输入框 ----------

  function buildBoxes(container) {
    const boxes = [];
    for (let i = 0; i < 8; i++) {
      const input = document.createElement('input');
      input.type = 'password';
      input.maxLength = 1;
      input.inputMode = 'numeric';
      input.autocomplete = 'off';
      container.appendChild(input);
      boxes.push(input);
    }
    return boxes;
  }

  const boxes1 = buildBoxes(group1El);
  const boxes2 = buildBoxes(group2El);

  // 当前参与输入的格子（设置模式下两组串联：第一组最后一格的"下一格"是第二组第一格）
  function activeBoxes() {
    return needSetup ? [...boxes1, ...boxes2] : boxes1;
  }

  function attachBox(box) {
    // 点击/聚焦哪格就从哪格开始输，选中已有数字以便直接替换
    box.addEventListener('focus', () => box.select());

    box.addEventListener('keydown', (e) => {
      const boxes = activeBoxes();
      const idx = boxes.indexOf(box);
      if (/^\d$/.test(e.key)) {
        e.preventDefault();
        box.value = e.key; // 替换当前位
        const next = boxes[idx + 1];
        if (next) next.focus();
        else trySubmit(); // 没有下一位了，自动确认
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        if (box.value) {
          box.value = '';
        } else {
          const prev = boxes[idx - 1];
          if (prev) { prev.value = ''; prev.focus(); }
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (boxes[idx - 1]) boxes[idx - 1].focus();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (boxes[idx + 1]) boxes[idx + 1].focus();
      }
    });

    // 移动端虚拟键盘等 keydown 未拦截场景的兜底
    box.addEventListener('input', () => {
      const d = box.value.replace(/\D/g, '').slice(-1);
      box.value = d;
      if (d) {
        const boxes = activeBoxes();
        const next = boxes[boxes.indexOf(box) + 1];
        if (next) next.focus();
        else trySubmit();
      }
    });

    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
      if (!digits) return;
      const boxes = activeBoxes();
      let i = boxes.indexOf(box);
      for (const d of digits) {
        if (i >= boxes.length) break;
        boxes[i++].value = d;
      }
      boxes[Math.min(i, boxes.length - 1)].focus();
      if (i >= boxes.length) trySubmit(); // 已填满，自动确认
    });
  }

  boxes1.concat(boxes2).forEach(attachBox);
  boxes1[0].focus(); // 默认焦点在第一位

  // ---------- 提交 ----------

  function getCode(boxes) {
    return boxes.map((b) => b.value).join('');
  }

  function focusFirstEmpty(boxes) {
    const empty = boxes.find((b) => !b.value);
    (empty || boxes[0]).focus();
  }

  function shake() {
    cardEl.classList.remove('shake');
    void cardEl.offsetWidth; // 重新触发动画
    cardEl.classList.add('shake');
  }

  function trySubmit() {
    document.getElementById('form').requestSubmit();
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';

    const code = getCode(boxes1);
    if (!/^\d{8}$/.test(code)) {
      errorEl.textContent = '请输入完整的 8 位访问码';
      focusFirstEmpty(boxes1);
      shake();
      return;
    }
    if (needSetup) {
      const code2 = getCode(boxes2);
      if (!/^\d{8}$/.test(code2)) {
        errorEl.textContent = '请再次输入访问码';
        focusFirstEmpty(boxes2);
        shake();
        return;
      }
      if (code !== code2) {
        errorEl.textContent = '两次输入的访问码不一致';
        boxes2.forEach((b) => (b.value = ''));
        boxes2[0].focus();
        shake();
        return;
      }
    }

    btnEl.disabled = true;
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, redirect: redirectTo }),
      });
      const data = await res.json();
      if (data.ok) {
        location.replace(data.redirect || '/');
      } else {
        errorEl.textContent = data.error || '验证失败';
        boxes1.forEach((b) => (b.value = ''));
        boxes1[0].focus();
        shake();
      }
    } catch {
      errorEl.textContent = '网络错误，请稍后再试';
    } finally {
      btnEl.disabled = false;
    }
  });

  // ---------- 状态查询：是否首次使用 / 是否已登录 ----------

  fetch('/api/auth/status')
    .then((r) => r.json())
    .then((s) => {
      if (s.authed) {
        location.replace(redirectTo);
        return;
      }
      needSetup = s.needSetup;
      if (needSetup) {
        subtitleEl.textContent = '首次使用，请设置 8 位数字访问码';
        label1El.classList.remove('hidden');
        label2El.classList.remove('hidden');
        group2El.classList.remove('hidden');
        btnEl.textContent = '设置并进入';
      }
    })
    .catch(() => { errorEl.textContent = '无法连接服务器'; });
</script>
</body>
</html>
