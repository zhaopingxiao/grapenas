<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Web Desktop 远程控制</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header id="toolbar">
    <div class="brand">
      <span id="statusDot" class="dot"></span>
      <span>Web Desktop</span>
    </div>
    <div class="controls">
      <label class="field">屏幕
        <select id="monitorSelect"></select>
      </label>
      <button id="shortcutBtn">设置应用为快捷方式</button>
      <label class="field">画质
        <input id="qualityRange" type="range" min="20" max="95" step="5" value="70" />
        <span id="qualityValue" class="value">70</span>
      </label>
      <label class="field">帧率
        <input id="fpsRange" type="range" min="5" max="60" step="5" value="30" />
        <span id="fpsValue" class="value">30</span>
      </label>
      <label class="field">缩放
        <select id="scaleSelect">
          <option value="1">100%</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
          <option value="0.35">35%</option>
        </select>
      </label>
      <button id="fitBtn" class="active" title="在适应窗口和原始大小之间切换">适应窗口</button>
      <button id="fullscreenBtn">全屏</button>
      <button id="disconnectBtn">断开</button>
    </div>
    <div id="stats" class="stats">未连接</div>
  </header>

  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="remoteCursor" class="remote-cursor"></div>
    <div id="keyHint" class="key-hint">点击画面后可用键盘控制</div>
  </main>

  <!-- 桌面快捷方式列表（点击添加到应用页） -->
  <div id="shortcutPanel" class="shortcut-panel hidden">
    <div class="shortcut-head">
      <span>桌面快捷方式</span>
      <button id="shortcutClose" class="shortcut-close" title="关闭">×</button>
    </div>
    <div id="shortcutList" class="shortcut-list"></div>
  </div>

  <!-- 另一个页面正在控制桌面 -->
  <div id="lockOverlay" class="overlay hidden">
    <div class="panel">
      <p id="lockMsg">另一个网页正在控制桌面</p>
      <p class="lock-sub">关闭其他控制页面后将自动接管</p>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <p id="overlayMsg">正在连接…</p>
      <button id="refreshBtn" class="primary">刷新页面</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
